# Образ ARTEX для оценки Tencent TSec Benchmark — локальная сборка и запуск одной командой.
# Не влияет на производственный docker-compose.yml (несколько сервисов: artex+postgres).
# Использование:
#   cp bench/.env.example bench/.env   # заполнить LLM_API_KEY / BENCHMARK_TOKEN и т.д.
#   docker compose -f docker-compose.bench.yml up --build      # собрать и запустить на переднем плане (видны логи)
#   docker compose -f docker-compose.bench.yml up --build -d   # в фоне
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # остановить (добавьте -v, чтобы удалить и тома данных)
# Браузер: http://localhost:8787 (вход с ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Общая сеть с физической машиной: контейнер напрямую использует сетевой стек
    # хоста, что даёт прямой доступ к сети целей на хосте/через VPN. В режиме host
    # маппинг ports не используется, контейнер сразу занимает порты хоста:
    # 8787 (UI/API), 8788 (прокси) и внутренний PostgreSQL 5432 — убедитесь, что эти
    # три порта свободны на хосте (перед локальным тестом остановите сервисы, которые их занимают).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
